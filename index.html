<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green Room</title>
<style>
:root { color-scheme: light dark; --bg: #ffffff; --text: #1c1c1e; --muted: #5f5f66;
  --rule: #e2e2e6; --accent: #1f7a4d; --code-bg: #f2f2f5; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #111113; --text: #ececf0; --muted: #a2a2ab; --rule: #2c2c31;
    --accent: #5fd39a; --code-bg: #1e1e22; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%; }
main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 16px; }
h2 { font-size: 1.35rem; margin: 40px 0 8px; }
h3 { font-size: 1.1rem; margin: 28px 0 6px; }
a { color: var(--accent); overflow-wrap: anywhere; }
hr { border: 0; border-top: 1px solid var(--rule); margin: 32px 0; }
code { background: var(--code-bg); border-radius: 4px; padding: 1px 5px; font-size: 0.9em;
  overflow-wrap: anywhere; }
ul, ol { padding-left: 1.4em; }
li { margin: 4px 0; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--rule); }
th { color: var(--muted); font-weight: 600; }
footer { margin-top: 48px; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
<h1>Green Room</h1>
<p>An app for stand-up comedians: gigs, jokes, sets, recordings and publishing your shows.
Made by Who's Fancy Media, LLC.</p>
<ul><li><a href="privacy.html">Privacy Policy</a></li><li><a href="support.html">Support</a></li></ul>
<p>Contact: <a href="mailto:greenroomappinfo@gmail.com">greenroomappinfo@gmail.com</a></p>
<footer><a href="index.html">Green Room</a> · <a href="privacy.html">Privacy Policy</a> · <a href="support.html">Support</a></footer>
</main>
</body>
</html>
